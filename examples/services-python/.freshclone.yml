version: 1
runtime: python
services:
  database:
    image: postgres:17-alpine
    port: 5432
    timeout: 60
    env:
      POSTGRES_PASSWORD: freshclone-example-only
  cache:
    image: redis:7-alpine
    port: 6379
steps:
  - block: verify
expect:
  output:
    - block: verify
      contains: services-ready
