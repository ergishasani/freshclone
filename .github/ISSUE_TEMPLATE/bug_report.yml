name: Bug report
description: Report a reproducible problem with FreshClone.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, use the private reporting link in SECURITY.md. Review all logs and examples for secrets before posting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: List exact commands and steps. Link a small public reproduction repository if possible.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration and marked README blocks
      description: Paste the relevant .freshclone.yml and README blocks, with private information removed.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: FreshClone version or commit, Node.js/npm versions, operating system, and Docker version/daemon mode if applicable.
      placeholder: |
        FreshClone:
        Node.js:
        npm:
        OS:
        Docker:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the smallest useful excerpt. Raw application output may contain secrets.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked the reproduction and output for credentials and private data.
          required: true
