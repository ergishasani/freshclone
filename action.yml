name: FreshClone
description: Verify README setup instructions in a clean Docker environment.
author: ergishasani
branding:
  icon: terminal
  color: green

inputs:
  root:
    description: Project directory within the caller's checked-out workspace.
    required: false
    default: .
  config:
    description: Configuration path relative to the project root.
    required: false
    default: .freshclone.yml
  scenario:
    description: Optional named setup scenario.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check runner prerequisites
      shell: bash
      run: |
        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "FreshClone's action requires a Linux runner with Docker."
          exit 1
        fi
        docker info > /dev/null
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Build FreshClone
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --ignore-scripts
        npm run build
    - name: Check README onboarding
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        FRESHCLONE_ACTION_PATH: ${{ github.action_path }}
        FRESHCLONE_PROJECT_ROOT: ${{ inputs.root }}
        FRESHCLONE_CONFIG: ${{ inputs.config }}
        FRESHCLONE_SCENARIO: ${{ inputs.scenario }}
      run: |
        args=(check --root "$FRESHCLONE_PROJECT_ROOT" --config "$FRESHCLONE_CONFIG" --github)
        if [ -n "$FRESHCLONE_SCENARIO" ]; then
          args+=(--scenario "$FRESHCLONE_SCENARIO")
        fi
        node "$FRESHCLONE_ACTION_PATH/dist/src/cli.js" "${args[@]}"
